apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: vessel-k8s-lab.local
    http:
      paths:
      - path: /04-scaling
        pathType: Prefix
        backend:
          service:
            name: app-scaling-service
            port:
              number: 80
